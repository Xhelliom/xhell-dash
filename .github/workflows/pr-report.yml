name: PR Report

on:
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: pr-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Generate PR Report
    runs-on: ubuntu-latest
    needs: []
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      checks: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # --- Collect all metrics ---
      - name: TypeScript type check
        id: typecheck
        continue-on-error: true
        run: |
          npx tsc --noEmit 2>&1 | tee typecheck-output.txt
          echo "status=$?" >> $GITHUB_OUTPUT

      - name: ESLint
        id: eslint
        continue-on-error: true
        run: |
          npm run lint 2>&1 | tee eslint-output.txt
          echo "status=$?" >> $GITHUB_OUTPUT

      - name: Prettier check
        id: prettier
        continue-on-error: true
        run: |
          npx prettier --check "**/*.{ts,tsx,js,jsx,json,css,md,yml,yaml}" 2>&1 | tee prettier-output.txt
          echo "status=$?" >> $GITHUB_OUTPUT

      - name: Run tests with coverage
        id: tests
        continue-on-error: true
        run: |
          npm run test:coverage -- --reporter=json --outputFile=test-results.json 2>&1 | tee test-output.txt
          echo "status=$?" >> $GITHUB_OUTPUT

      - name: Dead code detection (Knip)
        id: knip
        continue-on-error: true
        run: |
          npx knip 2>&1 | tee knip-output.txt
          echo "status=$?" >> $GITHUB_OUTPUT

      - name: NPM Audit
        id: audit
        continue-on-error: true
        run: |
          npm audit --audit-level=moderate 2>&1 | tee audit-output.txt
          echo "status=$?" >> $GITHUB_OUTPUT

      - name: Build check
        id: build
        continue-on-error: true
        run: |
          npm run build 2>&1 | tee build-output.txt
          echo "status=$?" >> $GITHUB_OUTPUT

      # --- Generate and post the report ---
      - name: Generate PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            function readFile(path) {
              try { return fs.readFileSync(path, 'utf8'); } catch { return ''; }
            }

            function status(id) {
              const output = readFile(`${id}-output.txt`);
              // Check if the output contains error indicators
              const hasErrors = output.includes('error') || output.includes('Error') || output.includes('FAIL');
              return hasErrors ? 'failure' : 'success';
            }

            function icon(s) {
              return s === 'success' ? '✅' : '❌';
            }

            function truncate(text, max = 500) {
              if (!text || text.length <= max) return text || 'No output';
              return text.substring(0, max) + '\n... (truncated)';
            }

            const typecheck = readFile('typecheck-output.txt');
            const eslintOut = readFile('eslint-output.txt');
            const prettierOut = readFile('prettier-output.txt');
            const testOut = readFile('test-output.txt');
            const knipOut = readFile('knip-output.txt');
            const auditOut = readFile('audit-output.txt');
            const buildOut = readFile('build-output.txt');

            const typecheckOk = !typecheck.includes('error TS');
            const eslintOk = !eslintOut.includes('Error') && !eslintOut.includes('error');
            const prettierOk = !prettierOut.includes('Forgot to run');
            const testOk = !testOut.includes('FAIL') && !testOut.includes('failed');
            const knipOk = !knipOut.includes('unused') && !knipOut.includes('Unused');
            const auditOk = !auditOut.includes('high') && !auditOut.includes('critical');
            const buildOk = !buildOut.includes('Error') && !buildOut.includes('error');

            const allOk = typecheckOk && eslintOk && prettierOk && testOk && buildOk;

            const body = `## 📊 PR Quality Report

            | Check | Status | Details |
            |-------|--------|---------|
            | TypeScript | ${icon(typecheckOk)} | ${typecheckOk ? 'No type errors' : 'Type errors found'} |
            | ESLint | ${icon(eslintOk)} | ${eslintOk ? 'No linting issues' : 'Linting issues found'} |
            | Prettier | ${icon(prettierOk)} | ${prettierOk ? 'Code properly formatted' : 'Formatting issues found'} |
            | Tests | ${icon(testOk)} | ${testOk ? 'All tests passing' : 'Test failures detected'} |
            | Dead Code (Knip) | ${icon(knipOk)} | ${knipOk ? 'No unused code detected' : 'Unused code found'} |
            | NPM Audit | ${icon(auditOk)} | ${auditOk ? 'No high/critical vulnerabilities' : 'Vulnerabilities found'} |
            | Build | ${icon(buildOk)} | ${buildOk ? 'Build successful' : 'Build failed'} |

            **Overall: ${allOk ? '✅ All checks passed' : '⚠️ Some checks need attention'}**

            ---

            <details>
            <summary>🔍 TypeScript Details</summary>

            \`\`\`
            ${truncate(typecheck)}
            \`\`\`
            </details>

            <details>
            <summary>📝 ESLint Details</summary>

            \`\`\`
            ${truncate(eslintOut)}
            \`\`\`
            </details>

            <details>
            <summary>🎨 Prettier Details</summary>

            \`\`\`
            ${truncate(prettierOut)}
            \`\`\`
            </details>

            <details>
            <summary>🧪 Test Details</summary>

            \`\`\`
            ${truncate(testOut, 1000)}
            \`\`\`
            </details>

            <details>
            <summary>🧹 Dead Code (Knip) Details</summary>

            \`\`\`
            ${truncate(knipOut)}
            \`\`\`
            </details>

            <details>
            <summary>🔒 NPM Audit Details</summary>

            \`\`\`
            ${truncate(auditOut)}
            \`\`\`
            </details>

            <details>
            <summary>🏗️ Build Details</summary>

            \`\`\`
            ${truncate(buildOut)}
            \`\`\`
            </details>

            ---
            *Generated by GitHub Actions • ${new Date().toISOString()}*`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('📊 PR Quality Report')
            );

            const commentBody = body.split('\n').map(l => l.trim()).join('\n');

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }
