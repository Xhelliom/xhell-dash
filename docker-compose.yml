services:
  xhell-dash:
    image: ghcr.io/xhelliom/xhell-dash:latest
    container_name: xhell-dash
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: file:/app/data/xhell.db
      AUTH_SECRET: ${AUTH_SECRET:?La variable AUTH_SECRET est requise — voir .env.example}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Tokens API optionnels (voir .env.example)
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      TRUENAS_API_KEY: ${TRUENAS_API_KEY:-}
      HOMEASSISTANT_API_KEY: ${HOMEASSISTANT_API_KEY:-}
    volumes:
      - xhell-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  xhell-data:
    driver: local
